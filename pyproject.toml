[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grammarguard"
version = "0.1.0"
description = "Offline preflight checks for regex constraints used in guided/structured generation (vLLM/SGLang structured outputs, outlines, JSON Schema pattern fields)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anish Pentyala" }]
requires-python = ">=3.10"
keywords = [
    "structured-outputs",
    "guided-decoding",
    "constrained-decoding",
    "regex",
    "llm",
    "vllm",
    "json-schema",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
grammarguard = "grammarguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
